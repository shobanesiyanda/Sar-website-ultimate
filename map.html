
<!DOCTYPE html>
<html>
<head>
<title>Africa Mining Map</title>
<link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet'/>
<script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
<style>
#map{height:90vh}
</style>
</head>

<body>

<h1>SAR African Operations Map</h1>
<div id="map"></div>

<script>
mapboxgl.accessToken = 'YOUR_MAPBOX_TOKEN';

const map = new mapboxgl.Map({
container: 'map',
style: 'mapbox://styles/mapbox/satellite-streets-v12',
center: [24,-28],
zoom: 3
});

new mapboxgl.Marker().setLngLat([29,-26]).addTo(map);
new mapboxgl.Marker().setLngLat([23,-28]).addTo(map);

</script>

</body>
</html>
